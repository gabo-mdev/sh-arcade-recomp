name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSH_HOST_SDL=ON
          cmake --build build --config Release --parallel

      - name: Pack
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          .\tools\pack_release.ps1 -Version $ver -Exe .\build\splatterhouse.exe

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Splatterhouse-v*-Windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
